    <h1>Contact Us</h1>
    <div class = "banner">
        <h1> Contact Us</h1>
    </div>
    <div class = "row">
        <div class = "content">
            <h2>Contact Us</h2>
<form action="">
    <input type="text" placeholder="Enter your full name:" required><br><br>
    <input type="email" placeholder="Enter your email address:" required><br><br>
    <input type = "number" placeholder = "Enter your phone number: " required><br><br>
    <input type="date" placeholder="Enter your date of birth: " required><br><br>
    <input type = "password" placeholder = "Enter your password: " required><br><br>
    <input type = "color" placeholder = "Choose your favorite color: " required><br><br>
    <input type = "range" placeholder = "Select a range: " required><br><br>
    <input type = "url" placeholder = "Enter your website URL: " required><br><br>
    <input type = "search" placeholder = "Search for something: " required><br><br>
    <input type = "tel" placeholder = "Enter your phone number: " required><br><br>

    <input type = "radio"  name = "ratings" value = "1"> 1
    <input type = "radio"  name = "ratings" value = "2"> 2
    <input type = "radio"  name = "ratings" value = "3"> 3
    <input type = "radio"  name = "ratings" value = "4"> 4
    <input type = "radio"  name = "ratings" value = "5"> 5 <br><br>

    <input type = "checkbox" name = "subscribe" value = "bics"> Subscribe to BICS newsletter<br>
    <input type = "checkbox" name = "subscribe" value = "bbit"> Subscribe to BBIT newsletter<br><br>

    <select id="" name="" required>
        <option value="">Select your country</option>
        <option value="usa">Kenya</option>
        <option value="canada">Uganda</option>
        <option value="uk">Tanzania</option>
        <option value="south_sudan">South Sudan</option>
        <option value="rwanda">Rwanda</option>
    </select> <br><br>

    <textarea name="" id="" cols="30" rows="10" placeholder="Enter your message here: " required></textarea><br><br>
    <input type="submit" value="Submit Details"><br><br>
    <button type="submit">Update Details</button> <br><br>
    <button type="reset">Reset Form</button> <br><br>
    <input type = "reset" value = "Clear Form"> <br><br>
</form>
